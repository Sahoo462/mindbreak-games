<!doctype html>
<html lang="en" data-theme="light" data-look="dreamscape">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f6fb">
  <meta name="description" content="Take a tiny break with MindBreak: find a feel-good mini-game and make it your own.">
  <link rel="icon" href="{{ url_for('static', filename='graphics/mindbreak.svg') }}" type="image/svg+xml">
  <title>{% block title %}MindBreak — a little play goes a long way{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="{{ url_for('home') }}" aria-label="MindBreak home">
        <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
        <span>mindbreak<span class="brand-period">.</span></span>
      </a>
      <nav class="main-nav" aria-label="Main navigation">
        <a href="{{ url_for('home') }}#game-library">Explore games</a>
        <a href="{{ url_for('customize') }}">Make it yours</a>
      </nav>
      <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Toggle light and dark mode">
        <span class="theme-icon" aria-hidden="true">☾</span><span class="theme-label">Night mode</span>
      </button>
    </div>
  </header>
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <a class="brand footer-brand" href="{{ url_for('home') }}">
      <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span><span></span></span>
      <span>mindbreak<span class="brand-period">.</span></span>
    </a>
    <p>A little play goes a long way. Take good care of you.</p>
    <span class="footer-note">Made for your next tiny break <span aria-hidden="true">✳</span></span>
  </footer>
  <script src="{{ url_for('static', filename='js/asset-registry.js') }}" defer></script>
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
